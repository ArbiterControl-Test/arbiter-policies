version: "1.0"
provenance: { required: false, required_fields: [], artifact_path: ".ai/provenance.json" }
protected_paths:
  - { pattern: "src/**", label: "Source", risk_class: "standard" }
  - { pattern: "package.json", label: "Dependencies", risk_class: "standard" }
  - { pattern: "package-lock.json", label: "Dependencies", risk_class: "standard" }
evidence_requirements:
  - path_pattern: "src/**"
    required_approvals: { team: "ArbiterControl-Test/e2e-approvers", min_approvals: 1 }
    required_checks:
      - { name: "gitleaks", trusted_workflow: "ArbiterControl-Test/arbiter-trusted/.github/workflows/secret-scan.yml", trusted_workflow_sha: "47179fcc5eac312b40b7916d1011da509b6cad81" }
      - { name: "dependency-check", trusted_workflow: "ArbiterControl-Test/arbiter-trusted/.github/workflows/dependency-check.yml", trusted_workflow_sha: "47179fcc5eac312b40b7916d1011da509b6cad81" }
  - path_pattern: "package.json"
    required_approvals: { team: "ArbiterControl-Test/e2e-approvers", min_approvals: 1 }
    required_checks:
      - { name: "gitleaks", trusted_workflow: "ArbiterControl-Test/arbiter-trusted/.github/workflows/secret-scan.yml", trusted_workflow_sha: "47179fcc5eac312b40b7916d1011da509b6cad81" }
      - { name: "dependency-check", trusted_workflow: "ArbiterControl-Test/arbiter-trusted/.github/workflows/dependency-check.yml", trusted_workflow_sha: "47179fcc5eac312b40b7916d1011da509b6cad81" }
  - path_pattern: "package-lock.json"
    required_approvals: { team: "ArbiterControl-Test/e2e-approvers", min_approvals: 1 }
    required_checks:
      - { name: "gitleaks", trusted_workflow: "ArbiterControl-Test/arbiter-trusted/.github/workflows/secret-scan.yml", trusted_workflow_sha: "47179fcc5eac312b40b7916d1011da509b6cad81" }
      - { name: "dependency-check", trusted_workflow: "ArbiterControl-Test/arbiter-trusted/.github/workflows/dependency-check.yml", trusted_workflow_sha: "47179fcc5eac312b40b7916d1011da509b6cad81" }
escalation_conditions: []
failure_defaults: { protected_path_unavailable_input: DENY }
